<head>

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">

  <!--main style-->
  <link rel="stylesheet" type="text/css"
   href="{{ url_for('static', filename='styles/form.css') }}">
</head>


{%extends "layout.html"%}

{% block content%}


    <!-- FAQ
    ================================================== -->
    <div class="container mb-11 mt-11">
      <div class="w-xl-65 mx-auto">
        {% for qa in qas %}
            <div class="mb-8" id="accordionCurriculum">
              <div class="border rounded shadow mb-6 overflow-hidden">
                  <div class="d-flex align-items-center" id="curriculumheading{{qa.id}}">
                        <h5 class="mb-0 w-100">
                          <button 
                          class="d-flex align-items-center text-left p-5 min-height-80 text-dark fw-medium collapse-accordion-toggle line-height-one"
                           type="button" data-bs-toggle="collapse" data-bs-target="#Curriculumcollapse{{qa.id}}" aria-expanded="true" aria-controls="Curriculumcollapse{{qa.id}}">
                          {{qa.question}}  
                              <span class="ms-auto text-dark d-flex">
                                  <!-- Icon -->
                                  <svg width="15" height="2" viewBox="0 0 15 2" fill="none" xmlns="http://www.w3.org/2000/svg">
                                      <rect width="15" height="2" fill="currentColor"/>
                                  </svg>

                                  <svg width="15" height="16" viewBox="0 0 15 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                      <path d="M0 7H15V9H0V7Z" fill="currentColor"/>
                                      <path d="M6 16L6 8.74228e-08L8 0L8 16H6Z" fill="currentColor"/>
                                  </svg>

                              </span>
                          </button>
                        </h5>
                    </div>

                    <div id="Curriculumcollapse{{qa.id}}" class="collapse show" aria-labelledby="curriculumheading{{qa.id}}" data-parent="#accordionCurriculum">
                        <div class="p-6 border-top">
                          <p>{{qa.answer}}</p>

                        </div>
                    </div>
              </div>
            </div>

        {% endfor %}

      
      </div>
  </div>


{% endblock content%}
